<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Imán con RA</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #000; }
        a-scene { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        #instruccion {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 10px 20px;
            border-radius: 20px; font-size: 14px; z-index: 1000;
            text-align: center; width: 80%; max-width: 300px;
        }
        #unmuteBtn {
            position: absolute; top: 20px; right: 20px;
            background: #ff5722; color: white; border: none;
            padding: 12px 24px; border-radius: 30px;
            font-size: 16px; font-weight: bold; cursor: pointer; 
            z-index: 1001; display: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        #unmuteBtn:active { background: #e64a19; }
    </style>
</head>
<body>
    <div id="instruccion">Apunta la cámara a tu fotografía impresa</div>
    <button id="unmuteBtn">🔊 Activar sonido</button>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <video id="miVideo" 
                   src="./video.mp4" 
                   preload="auto" 
                   muted 
                   playsinline 
                   webkit-playsinline 
                   loop="true">
            </video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity light="type: ambient; intensity: 0.8;"></a-entity>

        <a-entity id="miTarget" mindar-image-target="targetIndex: 0">
            <a-video id="planoVideo" src="#miVideo" position="0 0 0"></a-video>
        </a-entity>
    </a-scene>

    <script>
        const targetEl = document.getElementById('miTarget');
        const videoEl = document.getElementById('miVideo');
        const planoVideo = document.getElementById('planoVideo');
        const unmuteBtn = document.getElementById('unmuteBtn');
        const instruccion = document.getElementById('instruccion');

        // ---------------------------------------------------------
        // 🛠️ CONFIGURACIÓN DE TAMAÑO
        // Si aún lo ves un poquito chico, sube este número (ej. 1.2 o 1.5).
        // Si se sale de la foto, bájalo (ej. 0.9).
        // ---------------------------------------------------------
        const ajusteEscala = 1.0; 

        videoEl.addEventListener('loadedmetadata', () => {
            const anchoVideo = videoEl.videoWidth;
            const altoVideo = videoEl.videoHeight;
            const proporcion = anchoVideo / altoVideo;

            // Lógica "COVER": Hacemos que el video cubra toda la foto
            if (proporcion < 1) {
                // Video Vertical (más alto que ancho)
                planoVideo.setAttribute('height', (1 / proporcion) * ajusteEscala);
                planoVideo.setAttribute('width', 1 * ajusteEscala);
            } else {
                // Video Horizontal (más ancho que alto)
                planoVideo.setAttribute('width', proporcion * ajusteEscala);
                planoVideo.setAttribute('height', 1 * ajusteEscala);
            }
            console.log(`Video ajustado con lógica COVER. Escala: ${ajusteEscala}`);
        });

        targetEl.addEventListener('targetFound', () => {
            videoEl.play().catch(error => {
                instruccion.innerText = "Toca la pantalla para reproducir";
                document.body.addEventListener('click', () => videoEl.play(), { once: true });
            });
            unmuteBtn.style.display = 'block';
            instruccion.innerText = "Toca 'Activar sonido' para escuchar";
        });

        targetEl.addEventListener('targetLost', () => {
            videoEl.pause();
            videoEl.currentTime = 0;
            unmuteBtn.style.display = 'none';
            instruccion.innerText = "Apunta la cámara a tu fotografía impresa";
        });

        unmuteBtn.addEventListener('click', () => {
            videoEl.muted = false;
            videoEl.volume = 1.0;
            unmuteBtn.style.display = 'none';
            instruccion.innerText = "¡Disfruta tu recuerdo!";
        });
    </script>
</body>
</html>
