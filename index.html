<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Imán con RA</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #instruccion {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 10px 20px;
            border-radius: 20px; font-size: 14px; z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="instruccion">Apunta la cámara a tu fotografía impresa</div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <!-- 1. Precargamos el video en los assets de A-Frame -->
        <a-assets>
            <!-- 
                Añadimos los atributos clave para navegadores móviles:
                muted: permite el autoplay en algunos casos.
                playsinline / webkit-playsinline: evita que el video se abra a pantalla completa en iOS.
                preload="auto": indica al navegador que cargue el video.
            -->
            <video id="miVideo" 
                   src="./video.mp4" 
                   preload="auto" 
                   muted 
                   playsinline 
                   webkit-playsinline 
                   loop="true">
            </video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity light="type: ambient; intensity: 0.8;"></a-entity>

        <!-- 2. Le damos un ID al target para poder escuchar sus eventos -->
        <a-entity id="miTarget" mindar-image-target="targetIndex: 0">
            <a-video src="#miVideo" 
                     position="0 0 0" 
                     height="1" 
                     width="1.78" 
                     rotation="0 0 0">
            </a-video>
        </a-entity>
    </a-scene>

    <script>
        // 3. Este script controla la reproducción del video
        const targetEl = document.getElementById('miTarget');
        const videoEl = document.getElementById('miVideo');

        // Cuando MindAR detecta la imagen, reproduce el video.
        targetEl.addEventListener('targetFound', () => {
            console.log('¡Imagen detectada! Reproduciendo video...');
            videoEl.play().catch(error => {
                console.error("Error al reproducir el video:", error);
                // Si la reproducción falla, mostramos la instrucción de tocar la pantalla.
                document.getElementById('instruccion').innerText = "Toca la pantalla para reproducir";
                document.body.addEventListener('click', () => videoEl.play(), { once: true });
            });
        });

        // Cuando MindAR pierde la imagen, pausa el video y lo reinicia.
        targetEl.addEventListener('targetLost', () => {
            console.log('Imagen perdida. Pausando video.');
            videoEl.pause();
            videoEl.currentTime = 0; // Opcional: reinicia el video al principio
        });
    </script>
</body>
</html>
