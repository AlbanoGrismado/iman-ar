<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Imán con RA</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #instruccion {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 10px 20px;
            border-radius: 20px; font-size: 14px; z-index: 1000;
            text-align: center;
        }
        #unmuteBtn {
            position: absolute; top: 20px; right: 20px;
            background: #ff5722; color: white; border: none;
            padding: 12px 24px; border-radius: 30px;
            font-size: 16px; font-weight: bold;
            cursor: pointer; z-index: 1001;
            display: none; /* Oculto hasta que se detecte la imagen */
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        #unmuteBtn:active { background: #e64a19; }
    </style>
</head>
<body>
    <div id="instruccion">Apunta la cámara a tu fotografía impresa</div>
    <!-- Botón para activar el sonido (aparece al detectar la imagen) -->
    <button id="unmuteBtn">🔊 Activar sonido</button>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- 
                El video sigue con muted="true" para permitir el autoplay.
                Luego lo desilenciamos con JavaScript cuando el usuario toca el botón.
            -->
            <video id="miVideo" 
                   src="./video.mp4" 
                   preload="auto" 
                   muted 
                   playsinline 
                   webkit-playsinline 
                   loop="true">
            </video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity light="type: ambient; intensity: 0.8;"></a-entity>

        <a-entity id="miTarget" mindar-image-target="targetIndex: 0">
            <a-video src="#miVideo" 
                     position="0 0 0" 
                     height="1" 
                     width="1.78" 
                     rotation="0 0 0">
            </a-video>
        </a-entity>
    </a-scene>

    <script>
        const targetEl = document.getElementById('miTarget');
        const videoEl = document.getElementById('miVideo');
        const unmuteBtn = document.getElementById('unmuteBtn');
        const instruccion = document.getElementById('instruccion');

        // Al detectar la imagen, reproducimos el video (silenciado) y mostramos el botón.
        targetEl.addEventListener('targetFound', () => {
            console.log('Imagen detectada. Reproduciendo video en silencio...');
            videoEl.play().catch(error => {
                console.error("Error al reproducir el video:", error);
                instruccion.innerText = "Toca la pantalla para reproducir";
                document.body.addEventListener('click', () => videoEl.play(), { once: true });
            });
            // Mostramos el botón para activar el sonido
            unmuteBtn.style.display = 'block';
            instruccion.innerText = "Toca 'Activar sonido' para escuchar";
        });

        // Al perder la imagen, pausamos y reiniciamos.
        targetEl.addEventListener('targetLost', () => {
            console.log('Imagen perdida. Pausando video.');
            videoEl.pause();
            videoEl.currentTime = 0;
            unmuteBtn.style.display = 'none'; // Ocultamos el botón
            instruccion.innerText = "Apunta la cámara a tu fotografía impresa";
        });

        // Evento del botón para activar el sonido.
        unmuteBtn.addEventListener('click', () => {
            videoEl.muted = false;
            videoEl.volume = 1.0;
            unmuteBtn.style.display = 'none';
            instruccion.innerText = "¡Disfruta tu recuerdo!";
        });
    </script>
</body>
</html>
